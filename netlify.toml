[build]
  command = "pnpm build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  # Increment this to bust the Netlify build cache
  CACHE_BUST = "2"

[functions]
  # mysql2 uses native bindings — mark as external so esbuild doesn't try to bundle it
  # csv-parse must also be external so esbuild can resolve it at runtime
  external_node_modules = ["mysql2"]

# ─── Netlify Image CDN ────────────────────────────────────────────────────────
# Allow /.netlify/images to transform images from our CloudFront CDN.
# This enables automatic WebP conversion and resizing without re-uploading files.
[images]
  remote_images = ["https://d2xsxph8kpxj0f.cloudfront.net/.*"]

